<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17191a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="밤의 시계">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <title>밤의 시계</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --night: #17191a;
        --light: #f2e9d5;
        --steel: #c6bfae;
        --tile-top: #45433f;
        --tile-bottom: #302f2c;
        --tile-edge: #53514a;
        --accent: #d1a760;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background: var(--night);
        color: var(--light);
      }

      .clock-app {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        align-content: center;
        justify-items: center;
        overflow: hidden;
        padding:
          calc(env(safe-area-inset-top, 0px) + 1.25rem)
          max(1rem, env(safe-area-inset-right, 0px))
          calc(env(safe-area-inset-bottom, 0px) + 1.25rem)
          max(1rem, env(safe-area-inset-left, 0px));
      }

      .clock-stage {
        display: grid;
        justify-items: center;
        gap: clamp(1.5rem, 5vh, 3rem);
        width: 100%;
        text-align: center;
      }

      .calendar-date {
        margin: 0;
        color: var(--steel);
        font-size: clamp(0.95rem, 3.8vw, 1.2rem);
        font-weight: 400;
        letter-spacing: 0.015em;
      }

      .clock-time {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.25rem, 1.4vw, 0.75rem);
        max-width: 100%;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .clock-digit {
        display: grid;
        width: clamp(2.2rem, 13.2vw, 7.1rem);
        height: clamp(3.2rem, 21vw, 10rem);
        place-items: center;
        border: 1px solid var(--tile-edge);
        border-radius: clamp(0.18rem, 0.8vw, 0.45rem);
        background: linear-gradient(
          to bottom,
          var(--tile-top) 0 49%,
          #171819 49% 51%,
          var(--tile-bottom) 51%
        );
        box-shadow: 0 6px 0 #111213, inset 0 0 18px #1116;
        color: var(--light);
        font-size: clamp(2rem, 12.8vw, 7rem);
        font-weight: 450;
        line-height: 1;
      }

      .clock-separator {
        color: var(--accent);
        font-size: clamp(1.5rem, 8vw, 4rem);
      }

      .screen-reader-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .screen-reader-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-height: 560px) and (orientation: landscape) {
        .clock-stage {
          gap: 1rem;
        }

        .clock-digit {
          width: clamp(2.1rem, 10vw, 5.5rem);
          height: clamp(2.8rem, 25vh, 5rem);
          font-size: clamp(1.9rem, 9.5vw, 4.6rem);
        }

        .clock-separator {
          font-size: clamp(1.5rem, 6vw, 3rem);
        }
      }

      @media (max-width: 380px) {
        .clock-time {
          gap: 0.15rem;
        }

        .clock-digit {
          width: clamp(1.7rem, 11vw, 3.4rem);
          height: clamp(2.8rem, 18vw, 5rem);
          font-size: clamp(1.6rem, 10vw, 3rem);
        }

        .clock-separator {
          font-size: clamp(1.35rem, 7vw, 2.4rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="clock-app">
      <main class="clock-stage">
        <p class="calendar-date" id="calendar-date"></p>
        <time class="clock-time" id="clock-time" aria-label="">
          <span class="screen-reader-only" id="clock-time-label"></span>
        </time>
      </main>
      <p class="screen-reader-status" id="app-status" role="status" aria-live="polite"></p>
    </div>

    <script>
      const clockTime = document.querySelector("#clock-time");
      const clockTimeLabel = document.querySelector("#clock-time-label");
      const calendarDate = document.querySelector("#calendar-date");
      const appStatus = document.querySelector("#app-status");
      const clockSegments = [];
      const timeFormatter = new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });
      const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });

      let wakeLock = null;
      const wakeLockSupported = Boolean(navigator.wakeLock?.request);
      let wakeRequestPending = false;
      let wakeRetryTimer = null;
      let wakeRetryDelay = 5000;

      function updateClock() {
        const now = new Date();

        clockTime.dateTime = now.toISOString();
        const timeText = `${timeFormatter.format(now)}:${String(now.getSeconds()).padStart(2, "0")}`;
        clockTime.setAttribute("aria-label", timeText);
        clockTimeLabel.textContent = timeText;
        if (clockSegments.length === 0) {
          for (const character of timeText) {
            const segment = document.createElement("span");
            segment.className = character === ":" ? "clock-separator" : "clock-digit";
            segment.setAttribute("aria-hidden", "true");
            clockTime.append(segment);
            clockSegments.push(segment);
          }
        }
        clockSegments.forEach((segment, index) => {
          segment.textContent = timeText[index];
        });
        calendarDate.textContent = dateFormatter.format(now);

        window.setTimeout(updateClock, 1000 - (Date.now() % 1000));
      }

      function setWakeStatus(message) {
        appStatus.textContent = message;
      }

      function clearWakeRetry() {
        if (wakeRetryTimer !== null) {
          window.clearTimeout(wakeRetryTimer);
          wakeRetryTimer = null;
        }
      }

      function scheduleWakeRetry(delay = wakeRetryDelay) {
        if (
          !wakeLockSupported ||
          document.visibilityState !== "visible" ||
          wakeLock ||
          wakeRequestPending ||
          wakeRetryTimer !== null
        ) {
          return;
        }

        wakeRetryTimer = window.setTimeout(() => {
          wakeRetryTimer = null;
          void requestWakeLock();
        }, delay);
        wakeRetryDelay = Math.min(wakeRetryDelay * 2, 60000);
      }

      async function requestWakeLock() {
        if (
          !wakeLockSupported ||
          document.visibilityState !== "visible" ||
          wakeLock ||
          wakeRequestPending
        ) {
          return;
        }

        clearWakeRetry();
        wakeRequestPending = true;
        try {
          const sentinel = await navigator.wakeLock.request("screen");
          if (document.visibilityState !== "visible") {
            await sentinel.release();
            return;
          }

          wakeLock = sentinel;
          wakeRetryDelay = 5000;
          setWakeStatus("화면이 계속 켜져 있어요.");
          sentinel.addEventListener("release", () => {
            if (wakeLock === sentinel) {
              wakeLock = null;
            }
            if (document.visibilityState === "visible") {
              setWakeStatus("화면 유지가 중단됐어요. 화면을 다시 열면 자동으로 재시도합니다.");
              scheduleWakeRetry(1500);
            }
          }, { once: true });
        } catch (error) {
          console.error("화면 유지 요청에 실패했습니다.", error);
          wakeLock = null;
          setWakeStatus(
            error instanceof DOMException && error.name === "NotAllowedError"
              ? "브라우저가 자동 화면 유지를 거부했어요. Safari 설정과 자동 잠금 시간을 확인하세요."
              : "화면 유지를 시작하지 못했어요. 화면을 다시 열면 자동으로 재시도합니다."
          );
        } finally {
          wakeRequestPending = false;
          if (wakeLockSupported && document.visibilityState === "visible" && !wakeLock) {
            scheduleWakeRetry();
          }
        }
      }

      updateClock();

      if (!wakeLockSupported) {
        setWakeStatus("이 브라우저에서는 화면 유지를 사용할 수 없어요. 최신 Safari와 보안 연결을 확인하거나 자동 잠금 시간을 조정하세요.");
      } else if (document.visibilityState === "visible") {
        setWakeStatus("화면이 꺼지지 않도록 자동으로 유지하고 있어요.");
        void requestWakeLock();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          clearWakeRetry();
          void requestWakeLock();
        }
      });

      document.addEventListener("pointerdown", () => {
        if (!wakeLock) {
          clearWakeRetry();
          void requestWakeLock();
        }
      }, { passive: true });

      if (!("serviceWorker" in navigator)) {
        setWakeStatus("이 브라우저에서는 오프라인 저장을 사용할 수 없어요.");
      } else if (!window.isSecureContext) {
        setWakeStatus("오프라인 저장과 화면 유지는 HTTPS 또는 localhost에서 실행해야 해요.");
      } else {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("오프라인 저장을 시작하지 못했습니다.", error);
          setWakeStatus("오프라인 저장을 시작하지 못했어요. 페이지를 다시 열어 주세요.");
        });
      }
    </script>
  </body>
</html>
